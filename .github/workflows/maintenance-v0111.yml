name: One-time V0.11.1 maintenance

on:
  push:
    branches:
      - audit/v0.11.1-consolidation

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: audit/v0.11.1-consolidation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove incorrect Xiaoyu portrait reference
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/data/scenarios/dossierDisparu.ts';
          const source = readFileSync(path, 'utf8');
          const incorrect = "      portraitUrl: '/assets/portraits/yaqiu.png',\n";
          if (source.includes(incorrect)) {
            writeFileSync(path, source.replace(incorrect, ''), 'utf8');
          }
          NODE

      - name: Update Vite within major version 7
        run: npm install vite@7.3.6 --save-exact

      - name: Validate maintenance result
        run: |
          npm run validate
          npm run build
          npm run audit:assets

      - name: Commit maintenance changes if needed
        run: |
          if git diff --quiet; then
            echo "No maintenance changes remaining."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/data/scenarios/dossierDisparu.ts
          git commit -m "Complete V0.11.1 maintenance"
          git push origin HEAD:audit/v0.11.1-consolidation
