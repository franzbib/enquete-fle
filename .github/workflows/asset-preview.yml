name: Asset optimization preview

on:
  push:
    branches:
      - audit/v0.11.1-consolidation

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate optimized previews
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          root = Path('public/assets')
          out = Path('asset-preview')
          rows = []

          for path in root.rglob('*'):
              if path.suffix.lower() not in {'.png', '.jpg', '.jpeg'}:
                  continue
              original_size = path.stat().st_size
              if original_size < 750 * 1024:
                  continue

              with Image.open(path) as image:
                  image = image.convert('RGB')
                  original_dimensions = image.size
                  category = path.parts[2] if len(path.parts) > 2 else ''
                  max_edge = 512 if category == 'portraits' else 1600
                  image.thumbnail((max_edge, max_edge), Image.Resampling.LANCZOS)

                  relative = path.relative_to(root).with_suffix('.webp')
                  target = out / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  image.save(target, 'WEBP', quality=84, method=6)

                  rows.append({
                      'source': str(path),
                      'preview': str(target),
                      'original_bytes': original_size,
                      'preview_bytes': target.stat().st_size,
                      'original_dimensions': original_dimensions,
                      'preview_dimensions': image.size,
                  })

          (out / 'report.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimized-assets-preview
          path: asset-preview
          if-no-files-found: error
