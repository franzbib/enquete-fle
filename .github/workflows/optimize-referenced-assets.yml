name: One-time lossless asset optimization

on:
  push:
    branches:
      - audit/v0.11.1-consolidation

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: audit/v0.11.1-consolidation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Convert heavy referenced images to lossless WebP
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path('.')
          public = root / 'public'
          source_files = list((root / 'src').rglob('*.ts')) + list((root / 'src').rglob('*.tsx'))
          threshold = 750 * 1024
          changed_sources = set()
          conversions = []

          for source_path in source_files:
              text = source_path.read_text(encoding='utf-8')
              original_text = text
              refs = sorted(set(re.findall(r"/assets/[^'\"`)]+\.(?:png|jpg|jpeg)", text, flags=re.I)))

              for ref in refs:
                  asset_path = public / ref.lstrip('/')
                  if not asset_path.exists() or asset_path.stat().st_size <= threshold:
                      continue

                  target = asset_path.with_suffix('.webp')
                  if not target.exists():
                      with Image.open(asset_path) as image:
                          image.save(target, 'WEBP', lossless=True, method=6)

                  old_size = asset_path.stat().st_size
                  new_size = target.stat().st_size
                  if new_size >= old_size:
                      if target.exists():
                          target.unlink()
                      continue

                  new_ref = ref.rsplit('.', 1)[0] + '.webp'
                  text = text.replace(ref, new_ref)
                  conversions.append((ref, new_ref, old_size, new_size))

              if text != original_text:
                  source_path.write_text(text, encoding='utf-8')
                  changed_sources.add(str(source_path))

          if conversions:
              print('Lossless conversions applied:')
              for old_ref, new_ref, old_size, new_size in conversions:
                  reduction = 100 * (1 - new_size / old_size)
                  print(f'- {old_ref} -> {new_ref}: {old_size/1024:.0f} KB -> {new_size/1024:.0f} KB ({reduction:.1f}% smaller)')
          else:
              print('No referenced image benefited from lossless WebP conversion.')
          PY

      - name: Validate optimized application
        run: |
          npm ci
          npm run validate
          npm run build
          npm run audit:assets

      - name: Commit optimized assets if useful
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard 'public/assets/*.webp' 'public/assets/**/*.webp')" ]; then
            echo "No useful asset conversions to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public/assets
          git commit -m "Optimize referenced image assets losslessly"
          git push origin HEAD:audit/v0.11.1-consolidation
