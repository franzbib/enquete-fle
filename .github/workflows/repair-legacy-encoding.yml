name: One-time legacy encoding repair

on:
  push:
    branches:
      - audit/v0.11.1-consolidation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/v0.11.1-consolidation
          fetch-depth: 0

      - name: Repair mojibake if present
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('docs/agent-context/09_DECISIONS_LOG.md')
          text = path.read_text(encoding='utf-8')
          if 'Ã' in text or 'â€' in text or 'Â' in text:
              fixed = text.encode('cp1252').decode('utf-8')
              path.write_text(fixed, encoding='utf-8')
              print('Legacy decision log encoding repaired.')
          else:
              print('No mojibake detected.')
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent-context/09_DECISIONS_LOG.md
          git commit -m "Repair legacy decision log encoding"
          git push origin HEAD:audit/v0.11.1-consolidation
